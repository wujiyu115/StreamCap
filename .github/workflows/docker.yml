name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:   # 支持在 Actions 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/streamcap:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/streamcap:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/streamcap:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/streamcap:buildcache,mode=max
