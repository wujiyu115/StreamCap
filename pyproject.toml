[project]
name = "StreamCap"
version = "2.0.0"
description = "Live Stream Recorder - Recording management, media library and person-detection clipping platform"
authors = [{ name = "Hmily" }]
license = {text = "Apache-2.0"}
readme = "README.md"
url='https://github.com/ihmily/StreamCap'
requires-python = ">=3.10,<4.0"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx[http2]>=0.28.1",
    "aiofiles>=25.1.0",
    "streamget>=4.0.10",
    "python-dotenv>=1.2.2",
    "cachetools>=7.1.4",
    "deprecated>=1.3.1",
    "loguru>=0.7.2"
]

[project.urls]
Documentation = "https://github.com/ihmily/StreamCap/wiki"
Homepage = "https://github.com/ihmily/StreamCap"
Source = "https://github.com/ihmily/StreamCap"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
packages = [
    { include = "app", from = "." },
]

[tool.poetry.dependencies]
fastapi = ">=0.115.0"
uvicorn = ">=0.32.0"
httpx = "^0.28.1"
aiofiles = "~25.1.0"
streamget = ">=4.0.10"
python-dotenv = "~1.2.2"
cachetools = ">=7.1.6"
deprecated = ">=1.3.1"
loguru = ">=0.7.2"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "~0.16.0"
