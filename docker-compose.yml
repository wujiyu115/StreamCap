services:
  streamcap:
    build: .
    image: streamcap:latest
    tty: true
    ports:
      - "${PORT:-6006}:${PORT:-6006}"
    environment:
      - PORT=${PORT:-6006}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./downloads:/app/downloads
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:${PORT:-6006}/api/system/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
